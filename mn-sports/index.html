<title>Minnesota Sports: Pros + Gophers</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
:root{--bg:#000;--panel:#0d0d0d;--ink:#f2f2f2;--mute:#9a9a9a;--line:#242424;--maroon:#c23a55;--gold:#ffcc33;--live:#ff4d5e;--lift:30%;color-scheme:dark}
:root[data-theme="light"]{--bg:#f6f4f1;--panel:#fff;--ink:#1d1418;--mute:#6d6065;--line:#e4dedb;--maroon:#7a0019;--live:#c8102e;--lift:0%;color-scheme:light}
:root[data-theme="light"] .res.w small{color:#1a8a4a}
*{box-sizing:border-box}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 Barlow,system-ui,sans-serif}
.theme{flex:none;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--panel);color:var(--ink);font-size:18px;line-height:1;cursor:pointer;z-index:3}
.theme:hover{border-color:var(--mute)}
.theme:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
header{padding:28px 20px 12px;max-width:760px;margin:0 auto}
h1{font:700 44px/1 "Barlow Condensed",Impact,sans-serif;margin:0 0 6px;letter-spacing:.01em}
h1 span{color:var(--maroon)}
header p{margin:0;color:var(--mute)}
.filters{position:relative}
.filters summary{cursor:pointer;list-style:none;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;padding:8px 14px;font:600 14px/1.1 Barlow,sans-serif;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.filters summary:hover{border-color:var(--mute)}
.filters summary::-webkit-details-marker{display:none}
.filters summary::before{content:"\25B8";display:inline-block;width:1.1em;transition:transform .15s}
.filters[open] summary::before{transform:rotate(90deg)}
.filters summary:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.filters .chips{position:absolute;right:0;top:calc(100% + 8px);width:min(420px,calc(100vw - 32px));background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px;z-index:20}
.chip{border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:6px 12px;border-radius:999px;font:500 14px Barlow,sans-serif;cursor:pointer}
.chip[aria-pressed=true]{background:var(--maroon);border-color:var(--maroon);color:#fff}
.chip.g[aria-pressed=true]{background:var(--gold);border-color:var(--gold);color:#4a0010}
.chip:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
main{padding:0 20px 50px 0}
h2{font:600 20px "Barlow Condensed",sans-serif;margin:26px 0 8px;color:var(--mute);letter-spacing:.03em}
.game{--tc:color-mix(in srgb,var(--c),var(--ink) var(--lift));display:grid;grid-template-columns:88px 1fr;gap:16px;align-items:start;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:12px 16px 12px 12px;margin-bottom:10px;transition:border-color .15s}
.game:hover{border-color:color-mix(in srgb,var(--c),var(--ink) 30%)}
.lcol{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.lcol .when{align-self:stretch}
.lcol>div{align-self:stretch}
.lkbox{display:block;box-sizing:border-box;font:600 11px/1.25 Barlow,sans-serif;padding:6px;border-radius:12px;text-align:center;text-decoration:none;color:var(--ink);border:1px solid color-mix(in srgb,var(--c) 65%,var(--ink))}
.lkbox:hover{background:color-mix(in srgb,var(--c) 25%,transparent)}
.lcol .pill.tv{display:block;align-self:stretch;box-sizing:border-box;font-size:11px;line-height:1.25;white-space:normal;padding:6px;border-radius:12px;text-align:center}
.when{display:flex;flex-direction:row;align-items:baseline;justify-content:center;gap:3px;min-height:34px;padding:0 2px;border-radius:12px;background:color-mix(in srgb,var(--c) 16%,var(--panel));color:color-mix(in srgb,var(--c) 55%,var(--ink));font:700 16px/1 "Barlow Condensed",sans-serif;align-items:center;white-space:nowrap}
.when i{font:600 16px "Barlow Condensed",sans-serif;font-style:normal;letter-spacing:0;margin:0;opacity:1}
.when.live{background:var(--live);color:#fff;font-size:16px}
.nw{white-space:nowrap}
.vs .rc{margin-left:7px;font-size:13px}
.dot{flex:none;width:13px;height:13px;border-radius:50%;background:var(--tc);border:2px solid var(--c2)}
.vs{display:flex;align-items:flex-start;gap:9px;font:700 15px/1.3 Barlow,sans-serif}
.opp{font:500 15px Barlow,sans-serif;color:var(--mute);margin:3px 0 6px}
.rc{font:600 14px Barlow,sans-serif;color:var(--mute);letter-spacing:.02em}
.opp .rc{margin-left:7px;font-size:13px}
.opp em{font-style:normal;text-transform:uppercase;font-size:12px;letter-spacing:.07em;margin-right:5px}
.sub{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.pill{display:inline-block;font:600 11px Barlow,sans-serif;letter-spacing:.05em;padding:2px 8px;border-radius:999px;background:color-mix(in srgb,var(--ink) 8%,transparent);color:var(--mute)}
.pill.lk{text-decoration:none;padding:4px 11px;border:1px solid color-mix(in srgb,var(--c) 65%,var(--ink));background:transparent;color:var(--ink)}
.pill.lk:hover{background:color-mix(in srgb,var(--c) 25%,transparent)}
.pill.tv{background:color-mix(in srgb,var(--c) 14%,transparent);color:color-mix(in srgb,var(--c) 55%,var(--ink))}
.res{text-align:center;font:700 24px/1 "Barlow Condensed",sans-serif;white-space:nowrap}
.res small{display:block;font:700 11px Barlow,sans-serif;letter-spacing:.08em;margin-bottom:3px}
.res.w small{color:#3ddc84}.res.l small{color:var(--mute)}
.res.l{color:var(--mute)}
.more{display:block;width:100%;margin:6px 0 10px;padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--panel);color:var(--ink);font:600 15px Barlow,sans-serif;cursor:pointer}
.more:hover{border-color:var(--mute)}
.more:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.stmsg{color:var(--mute);padding:10px 2px;font-size:14px}
.sthead{font:600 15px "Barlow Condensed",sans-serif;letter-spacing:.04em;text-transform:uppercase;color:var(--mute);margin:2px 0 6px}
.stscroll{overflow-x:auto}
.stt{width:100%;border-collapse:collapse;font-size:14px}
.stt th{font:600 11px Barlow,sans-serif;letter-spacing:.07em;text-transform:uppercase;color:var(--mute);text-align:left;padding:4px 8px;border-bottom:1px solid var(--line)}
.stt td{padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.stt td:first-child{color:var(--mute);width:28px}
.stt tr.me td{background:color-mix(in srgb,var(--c) 22%,transparent);font-weight:600}
.stt tr:last-child td{border-bottom:0}
.pill.rank{background:color-mix(in srgb,var(--c) 14%,transparent);color:color-mix(in srgb,var(--c) 55%,var(--ink))}
.picksbtn{margin-top:12px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;padding:7px 14px;font:600 14px Barlow,sans-serif;cursor:pointer}
.picksbtn+.picksbtn{margin-left:8px}
.picksbtn:hover{border-color:var(--mute)}
.picks{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:9px}
.pklab{font:600 11px Barlow,sans-serif;letter-spacing:.07em;text-transform:uppercase;color:var(--mute);margin-right:2px}
.pkdd{position:relative;flex:1;max-width:200px}
.pkdd.open{z-index:6}
.pkbtn{width:100%;display:flex;align-items:center;justify-content:space-between;gap:8px;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:10px;padding:6px 10px;font:600 13px Barlow,sans-serif;cursor:pointer;text-align:left}
.pkbtn.empty{color:var(--mute)}
.pkbtn:hover,.pkdd.open .pkbtn{border-color:var(--mute)}
.pkbtn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pkmenu{position:absolute;left:0;right:0;top:calc(100% + 4px);background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.pkopt{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;border:0;border-top:1px solid var(--line);background:transparent;color:var(--ink);padding:8px 10px;font:500 13px Barlow,sans-serif;cursor:pointer;text-align:left}
.pkopt:first-child{border-top:0}
.pkopt:hover{background:color-mix(in srgb,var(--c) 16%,transparent)}
.pkopt.on{background:color-mix(in srgb,var(--c) 28%,var(--panel))}
.pkopt.clr{color:var(--mute)}
.pk{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:5px 13px;font:600 13px Barlow,sans-serif;cursor:pointer;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pk:hover{border-color:var(--mute)}
.pk.on{background:color-mix(in srgb,var(--c) 30%,var(--panel));border-color:var(--tc)}
.pk.on::before{content:"\2713 "}
.pill.pick{font-weight:700}
.pill.pick.w{background:rgba(61,220,132,.16);color:#2fbf71}
.pill.pick.l{background:rgba(255,77,94,.16);color:var(--live)}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:10;display:flex;align-items:center;justify-content:center;padding:20px}
.sheet[hidden]{display:none}
.sheetp{width:100%;max-width:640px;max-height:86vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:18px 20px 22px}
.sheetx{float:right;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:transparent;color:var(--ink);font-size:16px;cursor:pointer}
.shtitle{font:700 28px "Barlow Condensed",sans-serif;margin-bottom:12px}
.big{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:6px}
.big div{border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.big b{display:block;font:700 28px/1 "Barlow Condensed",sans-serif}
.big span{font:600 11px Barlow,sans-serif;letter-spacing:.07em;text-transform:uppercase;color:var(--mute)}
.pbtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.pbtns button{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:7px 14px;font:600 13px Barlow,sans-serif;cursor:pointer}
.pbtns button:hover{border-color:var(--mute)}
.hr.w{color:#2fbf71}.hr.l{color:var(--live)}.hr{white-space:nowrap}
.layout{position:relative;max-width:1280px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:24px;justify-content:center;align-items:start}
.col{min-width:0}
.tools{position:absolute;top:14px;right:14px;z-index:3;display:flex;flex-direction:column;gap:8px;align-items:flex-end;max-width:calc(100% - 28px)}
.trow{display:flex;gap:8px;align-items:center;justify-content:flex-end;flex-wrap:wrap}
.tools .picksbtn{margin:0;padding:8px 14px;line-height:1.1}
@media (max-width:980px){.tools{position:static;max-width:none;padding:12px 16px 0}.layout header{padding-top:12px}.tools .picksbtn{font-size:13px;padding:8px 12px}}
.side{margin-top:104px;min-width:0}
.nfoot{padding:0 20px 30px}
.nhead h2{margin:14px 0 8px}
.pill-btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;padding:6px 13px;font:600 13px Barlow,sans-serif;cursor:pointer}
.pill-btn:hover{border-color:var(--mute)}
#newslist{padding:14px 20px 16px}
.nsec{background:var(--panel);border:1px solid var(--line);border-top:4px solid var(--c);border-radius:16px;padding:12px 16px 8px;margin-bottom:14px}
.nshead{display:flex;align-items:center;gap:10px;margin-bottom:4px}
.nshead h3{margin:0;font:700 24px "Barlow Condensed",sans-serif;flex:1}
.nlogo{flex:none;width:36px;height:36px;border-radius:9px;background:#fff;padding:4px;object-fit:contain}
.mv{display:flex;gap:6px}
.mv button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer}
.mv button:disabled{opacity:.3;cursor:default}
.nrow{display:block;padding:10px 0;border-top:1px solid var(--line);color:inherit;text-decoration:none}
.nrow:hover .nt{text-decoration:underline}
.nt{display:block;font:600 19px/1.25 Barlow,sans-serif}
.nrow.sm{padding:5px 0}
.nrow.sm .nt{font-size:13.5px;line-height:1.25}
.nrow.sm .nm{font-size:11px;margin-top:1px}
.nm{display:block;font-size:12px;color:var(--mute);margin-top:3px}
.nm b{font-weight:600;color:color-mix(in srgb,var(--c) 55%,var(--ink))}
.nmore{display:block;width:100%;border:0;border-top:1px solid var(--line);background:transparent;color:var(--mute);padding:10px 0 6px;font:600 13px Barlow,sans-serif;cursor:pointer}
@media (min-width:1180px){#newslist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;align-items:start}#newslist .nsec{margin-bottom:0}#newslist .msg{grid-column:1/-1}}
@media (max-width:980px){.layout{display:flex;flex-direction:column}.col{display:contents}.layout header{order:1}.side{order:2;margin-top:0}.newsblk{order:3}.layout footer{order:4;width:100%}main{padding:0 20px 20px}}
.msg{padding:30px 0;color:var(--mute)}
#diag{margin-bottom:8px}

<script>
// group: "pro" | "gopher". sport/league are ESPN path parts. id is the ESPN team id.
// Edit this list to add, remove, or fix a team.
const TEAMS=[
 {n:"Minnesota Vikings",g:"pro",s:"football",l:"nfl",id:16,c:"#4F2683",c2:"#FFC62F"},
 {n:"Minnesota Timberwolves",g:"pro",s:"basketball",l:"nba",id:16,c:"#236192",c2:"#0C2340"},
 {n:"Minnesota Twins",g:"pro",s:"baseball",l:"mlb",id:9,c:"#002B5C",c2:"#D31145"},
 {n:"Minnesota Wild",g:"pro",s:"hockey",l:"nhl",id:30,c:"#154734",c2:"#A6192E"},
 {n:"Minnesota United",g:"pro",s:"soccer",l:"usa.1",id:17362,c:"#8CD2F4",c2:"#231F20",board:true},
 {n:"Minnesota Lynx",g:"pro",s:"basketball",l:"wnba",id:8,c:"#78BE20",c2:"#236192"},
 {n:"Gophers Football",g:"gopher",s:"football",l:"college-football",id:135},
 {n:"Gophers Men's Basketball",g:"gopher",s:"basketball",l:"mens-college-basketball",id:135},
 {n:"Gophers Women's Basketball",g:"gopher",s:"basketball",l:"womens-college-basketball",id:135},
 {n:"Gophers Men's Hockey",g:"gopher",s:"hockey",l:"mens-college-hockey",id:135},
 {n:"Gophers Women's Hockey",g:"gopher",s:"hockey",l:"womens-college-hockey",id:135},
 {n:"Gophers Volleyball",g:"gopher",s:"volleyball",l:"womens-college-volleyball",id:135},
 {n:"Gophers Baseball",g:"gopher",s:"baseball",l:"college-baseball",id:135},
 {n:"Gophers Softball",g:"gopher",s:"baseball",l:"college-softball",id:135}
].map(t=>({...t,c:t.c||"#7A0019",c2:t.c2||"#FFCC33"}));

const URL_=t=>`https://site.api.espn.com/apis/site/v2/sports/${t.s}/${t.l}/teams/${t.id}/schedule`;
let games=[],recent=[],failed=[],diag=[],days=3,diagMN="",allGames=[],newsDiag="",filter="all";
const out=document.getElementById("out"),chips=document.getElementById("chips");

function parse(t,ev){
  const comp=ev.competitions&&ev.competitions[0]; if(!comp)return null;
  const me=comp.competitors.find(c=>String(c.team.id)===String(t.id))||comp.competitors[0];
  const opp=comp.competitors.find(c=>c!==me);
  const sc=c=>c&&c.score!=null?(typeof c.score==="object"?c.score.displayValue:c.score):null;
  const st=(comp.status||ev.status||{}).type||{};
  const L=ev.links||[],pick=r=>(L.find(l=>(l.rel||[]).includes(r))||{}).href,base="https://www.espn.com/"+(t.s==="soccer"?"soccer":t.l);
  return {t,date:new Date(ev.date),home:me.homeAway==="home",
    opp:opp?(opp.team.displayName||opp.team.name):"TBD",
    state:st.state,detail:st.shortDetail,win:me.winner,
    my:sc(me),their:sc(opp),
    eid:String(ev.id),mid:String(me.team.id),oid:opp?String(opp.team.id):null,mrec:recOf(me),orec:recOf(opp),
    box:pick("boxscore")||`${base}/boxscore/_/gameId/${ev.id}`,prev:pick("summary")||`${base}/${t.s==="soccer"?"match":"game"}/_/gameId/${ev.id}`,
    tv:[...new Set((comp.broadcasts||[]).flatMap(b=>b.names||(b.media&&b.media.shortName?[b.media.shortName]:[])))].join(", ")};
}

const ymd=d=>d.toISOString().slice(0,10).replace(/-/g,"");
async function getJSON(u){const r=await fetch(u);if(!r.ok)throw new Error(r.status);return r.json()}
async function load(){
  const seen=new Set(),add=(t,j)=>{let n=0;(j.events||[]).forEach(ev=>{
    const k=t.n+":"+ev.id; if(seen.has(k))return; seen.add(k);
    const g=parse(t,ev); if(g){games.push(g);n++}});return n};
  const mine=(t,j)=>({events:(j.events||[]).filter(ev=>ev.competitions&&ev.competitions[0].competitors.some(c=>String(c.team.id)===String(t.id)))});
  const board=(t,q)=>getJSON(`https://site.api.espn.com/apis/site/v2/sports/${t.s}/${t.l}/scoreboard?${q}`).then(j=>add(t,mine(t,j)));
  const day=n=>ymd(new Date(Date.now()+n*864e5));
  await Promise.all(TEAMS.map(async t=>{
    let ok=false;
    const run=async(label,fn)=>{try{diag.push(t.n+" "+label+": "+await fn());ok=true}catch(e){diag.push(t.n+" "+label+": error")}};
    await run("schedule",async()=>add(t,await getJSON(URL_(t))));
    if(t.board){
      // Soccer: the team schedule can omit upcoming matches, so also ask for fixtures and the league scoreboard
      await run("fixtures",async()=>add(t,await getJSON(URL_(t)+"?fixture=true")));
      await run("scoreboard",()=>board(t,`dates=${day(-3)}-${day(45)}&limit=300`));
      if(!games.some(g=>g.t===t&&g.state!=="post"&&g.date>Date.now()-4*36e5)){
        // Still nothing upcoming: ask the scoreboard one day at a time
        await run("by-day",async()=>{let n=0;await Promise.all(Array.from({length:30},(_,i)=>board(t,"dates="+day(i)).then(c=>{n+=c}).catch(()=>{})));return n});
      }
    }
    if(!ok)failed.push(t.n);
  }));
  allGames=games.slice();gradeAll();
  const now=Date.now();
  const d0=new Date();d0.setHours(0,0,0,0);const y0=new Date(d0);y0.setDate(y0.getDate()-1);
  const sod=d0.getTime(),syd=y0.getTime();
  recent=games.filter(g=>g.state==="post"&&g.date.getTime()>=syd&&g.date.getTime()<sod).sort((a,b)=>a.date-b.date);
  games=games.filter(g=>g.state==="in"||g.date.getTime()>=sod).sort((a,b)=>a.date-b.date);
  render();
  diagMN="Data check (Minnesota United): "+diag.filter(x=>x.startsWith("Minnesota United")).map(x=>x.replace("Minnesota United ","")).join(" | ");
  showDiag();
}

function buildChips(){
  const opts=[["all","All"],["pro","Pros"],["gopher","Gophers"],...TEAMS.map(t=>[t.n,t.n.replace("Gophers ",""),t.c])];
  chips.innerHTML="";
  document.getElementById("fsum").textContent="Teams: "+(opts.find(o=>o[0]===filter)||opts[0])[1];
  opts.forEach(([k,label,col])=>{
    const b=document.createElement("button");
    b.className="chip"+(k==="gopher"||k.startsWith("Gophers")?" g":"");
    b.textContent=label;if(col)b.style.borderLeft="5px solid "+col;b.setAttribute("aria-pressed",String(filter===k));
    b.onclick=()=>{filter=k;buildChips();render();document.getElementById("filters").open=false};
    chips.appendChild(b);
  });
}

const dayFmt=new Intl.DateTimeFormat(undefined,{weekday:"long",month:"short",day:"numeric"});
const timeFmt=new Intl.DateTimeFormat(undefined,{hour:"numeric",minute:"2-digit"});
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

const recOf=c=>{const r=c&&(c.record||c.records);if(typeof r==="string")return r;if(Array.isArray(r)){const x=r.find(y=>y.type==="total"||y.name==="overall")||r[0];return x&&(x.displayValue||x.summary)||null}return null};
const RC={},SB={},pend=new Set(),sbPend=new Set(),rst={tOk:0,tEmpty:0,tErr:0,sbOk:0,sbErr:0};
const GROUPS={"college-football":80,"mens-college-basketball":50,"womens-college-basketball":50};
const etDay=d=>d.toLocaleDateString("en-CA",{timeZone:"America/New_York"}).replace(/-/g,"");
const rkey=(g,id)=>`${g.t.s}/${g.t.l}/${id}`;
function recFor(g,who){
  const id=who==="m"?g.mid:g.oid; if(id==null)return"";
  const k=rkey(g,id);
  return RC[k]||SB[k]||(who==="m"?g.mrec:g.orec)||"";
}
function showDiag(){
  const d=document.getElementById("diag");
  if(d)d.textContent=[diagMN,newsDiag,`Records: team lookups ${rst.tOk} ok, ${rst.tEmpty} empty, ${rst.tErr} failed; scoreboards ${rst.sbOk} ok, ${rst.sbErr} failed`].filter(Boolean).join(" \u00b7 ");
}
async function loadRecords(list){
  const jobs=[];
  list.forEach(g=>{
    if(g.t.static)return;
    // 1) that day's league scoreboard: ESPN lists both teams' records on it
    const day=etDay(g.date),sk=`${g.t.s}/${g.t.l}/${day}`;
    if(!sbPend.has(sk)){
      sbPend.add(sk);
      jobs.push(getJSON(`https://site.api.espn.com/apis/site/v2/sports/${g.t.s}/${g.t.l}/scoreboard?dates=${day}${GROUPS[g.t.l]?"&groups="+GROUPS[g.t.l]:""}`).then(j=>{
        rst.sbOk++;
        (j.events||[]).forEach(ev=>((ev.competitions&&ev.competitions[0]&&ev.competitions[0].competitors)||[]).forEach(x=>{
          const r=recOf(x); if(r&&x.team)SB[`${g.t.s}/${g.t.l}/${x.team.id}`]=r;
        }));
      }).catch(()=>{rst.sbErr++}));
    }
    // 2) each team's own page, as a second source
    [g.mid,g.oid].forEach(id=>{
      if(id==null)return;
      const k=rkey(g,id); if(RC[k]!==undefined||pend.has(k))return; pend.add(k);
      jobs.push(getJSON(`https://site.api.espn.com/apis/site/v2/sports/${g.t.s}/${g.t.l}/teams/${id}`).then(j=>{
        const it=((j.team&&j.team.record&&j.team.record.items)||[]);
        const x=it.find(y=>y.type==="total")||it[0]; RC[k]=x&&x.summary||null;
        x&&x.summary?rst.tOk++:rst.tEmpty++;
      }).catch(()=>{RC[k]=null;rst.tErr++}));
    });
  });
  if(jobs.length){await Promise.all(jobs);showDiag();render()}
}
// ---- Standings (shared by all three layouts) ----
const ST={},SR={},stReq=new Set();
const gk=t=>t.s+"/"+t.l;
const sv=(e,...names)=>{for(const nm of names){const x=(e.stats||[]).find(y=>y.name===nm||y.abbreviation===nm||y.type===nm);if(x&&x.displayValue!=null&&x.displayValue!=="")return x}return null};
function walk(n,out){if(n&&n.standings&&n.standings.entries)out.push({name:n.name||n.abbreviation||"Standings",short:n.abbreviation||n.name||"Standings",entries:n.standings.entries});((n&&n.children)||[]).forEach(c=>walk(c,out));return out}
function norm(e){
  const w=sv(e,"wins"),l=sv(e,"losses"),tt=sv(e,"ties"),ot=sv(e,"otLosses"),o=sv(e,"overall","record","total");
  const rec=o?o.displayValue:(w&&l?[w.displayValue,l.displayValue,tt&&tt.displayValue,ot&&ot.displayValue].filter(x=>x!=null).join("-"):"");
  const pts=sv(e,"points"),pct=sv(e,"winPercent"),gb=sv(e,"gamesBehind"),seed=sv(e,"playoffSeed","rank"),tm=e.team||{};
  return {id:String(tm.id),name:tm.displayName||tm.name||"",rec,ex:(pts||pct||gb||{}).displayValue||"",label:pts?"PTS":pct?"PCT":gb?"GB":"",
    seed:seed?parseFloat(seed.value!=null?seed.value:seed.displayValue):NaN,sv:pts?+pts.value:pct?+pct.value:w?+w.value:0};
}
function getStandings(t){
  const k=gk(t); if(ST[k])return ST[k];
  return ST[k]=getJSON(`https://site.api.espn.com/apis/v2/sports/${t.s}/${t.l}/standings`).then(j=>{
    const gs=walk(j,[]).map(g=>{
      const es=g.entries.map(norm);
      if(es.every(e=>!isNaN(e.seed)))es.sort((a,b)=>a.seed-b.seed);else es.sort((a,b)=>b.sv-a.sv);
      return {name:g.name,short:g.short,entries:es,label:(es.find(e=>e.label)||{}).label||""};
    });
    SR[k]=gs.length?gs:null;
  }).catch(()=>{SR[k]=null});
}
const groupFor=(t,id)=>{const gs=SR[gk(t)];return gs&&gs.find(g=>g.entries.some(e=>e.id===String(id)))||null};
const ord=n=>{const s=["th","st","nd","rd"],v=n%100;return n+(s[(v-20)%10]||s[v]||s[0])};
function rankText(t,id){const g=groupFor(t,id);if(!g)return"";return ord(g.entries.findIndex(e=>e.id===String(id))+1)+" in "+g.short}
const gkey=g=>g.t.n+"|"+g.date.getTime()+"|"+g.opp;
function prefetchStandings(list){list.forEach(g=>{if(g.t.static||stReq.has(gk(g.t)))return;stReq.add(gk(g.t));getStandings(g.t).then(render)})}
// ---- Picks: choose a winner before the game starts, graded automatically afterward ----
let PICKS={};try{PICKS=JSON.parse(localStorage.getItem("mn-picks")||"{}")||{}}catch(e){PICKS={}}
const saveLocal=()=>{try{localStorage.setItem("mn-picks",JSON.stringify(PICKS))}catch(e){}};
const savePicks=()=>{saveLocal();schedulePush()};
const livePick=k=>PICKS[k]&&!PICKS[k].x?PICKS[k]:null;
const livePicks=()=>Object.values(PICKS).filter(p=>!p.x);
// stable fingerprint (key order doesn't matter) and a merge where the most recently changed pick wins
const sig=o=>JSON.stringify(Object.keys(o).sort().map(k=>[k,Object.keys(o[k]).sort().map(f=>[f,o[k][f]])]));
function mergeP(a,b){
  const out={};
  new Set([...Object.keys(a),...Object.keys(b)]).forEach(k=>{
    const x=a[k],y=b[k]; if(!x||!y){out[k]=x||y;return}
    const ux=x.u||0,uy=y.u||0;
    out[k]=ux>uy?x:uy>ux?y:(x.r&&!y.r)?x:y;
  });
  return out;
}
const shortName=n=>n.startsWith("Gophers")?"Gophers":n.replace("Minnesota ","");
let OPENPK=null;
const pickKey=g=>g.t.n+"|"+g.eid;
const dayShort=new Intl.DateTimeFormat(undefined,{month:"short",day:"numeric"});
function pickUI(g){
  if(g.t.static||!g.eid)return {pill:"",row:""};
  const k=pickKey(g),p=livePick(k);
  if(g.state==="pre"&&g.date.getTime()>Date.now()){
    const opt=(side,txt)=>`<button class="pkopt${p&&p.p===side?" on":""}" data-k="${esc(k)}" data-p="${side}">${esc(txt)}${p&&p.p===side?"<span>\u2713</span>":""}</button>`;
    const lab=p?(p.p==="m"?shortName(g.t.n):p.p==="o"?g.opp:"Draw"):"Choose winner",open=OPENPK===k;
    return {pill:"",row:`<div class="picks"><span class="pklab">Your pick</span><div class="pkdd${open?" open":""}"><button class="pkbtn${p?"":" empty"}" data-tog="${esc(k)}" aria-expanded="${open}"><span>${esc(lab)}</span><span>${open?"\u25B4":"\u25BE"}</span></button>${open?`<div class="pkmenu">${opt("m",shortName(g.t.n))}${g.t.s==="soccer"?opt("d","Draw"):""}${opt("o",g.opp)}${p?`<button class="pkopt clr" data-k="${esc(k)}" data-p="${p.p}">Clear pick</button>`:""}</div>`:""}</div></div>`};
  }
  if(!p)return {pill:"",row:""};
  const lab=p.p==="m"?shortName(g.t.n):p.p==="o"?g.opp:"Draw";
  return {pill:`<span class="pill pick ${p.r||""}">Pick: ${esc(lab)}${p.r==="w"?" \u2713":p.r==="l"?" \u2717":""}</span>`,row:""};
}
function gradeAll(){
  let ch=false;
  Object.entries(PICKS).forEach(([k,p])=>{
    if(p.x||p.r)return;
    const g=allGames.find(x=>x.eid&&pickKey(x)===k); if(!g||g.state!=="post")return;
    const a=parseFloat(g.my),b=parseFloat(g.their); if(isNaN(a)||isNaN(b))return;
    const w=a>b?"m":a<b?"o":g.win===true?"m":g.win===false?"o":"d";
    p.r=p.p===w?"w":"l";p.sc=g.my+"-"+g.their;p.u=Date.now();ch=true;
  });
  if(ch)savePicks();
}
function pickStats(){
  const gr=livePicks().filter(p=>p.r).sort((a,b)=>b.d-a.d);
  const w=gr.filter(p=>p.r==="w").length;
  let st=0;for(const p of gr){const up=p.r==="w";if(st===0)st=up?1:-1;else if(up===(st>0))st+=up?1:-1;else break}
  return {gr,w,l:gr.length-w,pct:gr.length?Math.round(100*w/gr.length):0,st};
}
function updateBadge(){
  const s=pickStats(),b=document.getElementById("picksbtn"),n=livePicks().length;
  b.textContent="\u{1F3C6} "+(s.gr.length?`Picks ${s.w}\u2013${s.l} \u00b7 ${s.pct}%${s.st?` \u00b7 ${s.st>0?"W":"L"}${Math.abs(s.st)}`:""}`:n?"Picks: waiting on results":"Picks: none yet");
}
function paintPicks(){
  const s=pickStats(),pend=livePicks().filter(p=>!p.r).length,by={};
  s.gr.forEach(p=>{const x=by[p.t]=by[p.t]||{w:0,l:0};p.r==="w"?x.w++:x.l++});
  const teams=Object.entries(by).sort((a,b)=>(b[1].w+b[1].l)-(a[1].w+a[1].l)).map(([n,x])=>`<tr><td>${esc(n)}</td><td>${x.w}\u2013${x.l}</td><td>${Math.round(100*x.w/(x.w+x.l))}%</td></tr>`).join("");
  const hist=livePicks().sort((a,b)=>b.d-a.d).slice(0,40).map(p=>{
    const lab=p.p==="m"?shortName(p.t):p.p==="o"?p.opp:"Draw";
    return `<tr><td>${dayShort.format(new Date(p.d))}</td><td>${esc(shortName(p.t))} vs ${esc(p.opp)}</td><td>${esc(lab)}</td><td class="hr ${p.r||""}">${p.r==="w"?"\u2713 "+esc(p.sc||""):p.r==="l"?"\u2717 "+esc(p.sc||""):"pending"}</td></tr>`}).join("");
  document.getElementById("picksp").innerHTML=`<button class="sheetx" id="px" aria-label="Close">\u2715</button><div class="shtitle">My picks</div>
  <div class="big"><div><b>${s.w}\u2013${s.l}</b><span>Record</span></div><div><b>${s.pct}%</b><span>Win rate</span></div><div><b>${s.st?(s.st>0?"W":"L")+Math.abs(s.st):"\u2013"}</b><span>Streak</span></div><div><b>${pend}</b><span>Pending</span></div></div>
  ${teams?`<div class="sthead" style="margin-top:14px">By team</div><div class="stscroll"><table class="stt"><thead><tr><th>Team</th><th>Record</th><th>Win %</th></tr></thead><tbody>${teams}</tbody></table></div>`:""}
  ${hist?`<div class="sthead" style="margin-top:14px">History</div><div class="stscroll"><table class="stt"><thead><tr><th>Date</th><th>Game</th><th>Pick</th><th>Result</th></tr></thead><tbody>${hist}</tbody></table></div>`:`<div class="stmsg">No picks yet. Tap a team under "Your pick" on any upcoming game.</div>`}
  <div class="pbtns"><button id="pexp">Export</button><button id="pimp">Import</button><button id="prst">Reset all</button></div>`;
}
function exportPicks(){
  const b=new Blob([JSON.stringify(PICKS,null,1)],{type:"application/json"}),a=document.createElement("a");
  a.href=URL.createObjectURL(b);a.download="mn-sports-picks.json";document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
function importPicks(){
  const i=document.createElement("input");i.type="file";i.accept="application/json";
  i.onchange=()=>{const f=i.files[0];if(!f)return;f.text().then(t=>{PICKS=mergeP(PICKS,JSON.parse(t));savePicks();gradeAll();render();paintPicks()}).catch(()=>alert("That file couldn't be read."))};
  i.click();
}
// ---- Headlines by team: ESPN live, other sources via news-extra.json (written by scripts/fetch-news.mjs) ----
function logoFor(t){
  const b="https://a.espncdn.com/i/teamlogos/";
  if(t.s==="soccer")return b+"soccer/500/"+t.id+".png";
  if(t.l.includes("college"))return b+"ncaa/500/"+t.id+".png";
  return b+t.l+"/500/min.png";
}
function relTime(ts){
  const m=Math.round((Date.now()-ts)/6e4);if(m<1)return"just now";if(m<60)return m+"m ago";
  const h=Math.round(m/60);if(h<24)return h+"h ago";
  const d=Math.round(h/24);return d<7?d+"d ago":dayShort.format(new Date(ts));
}
const SECTIONS=[
  {id:"vikings",n:"Minnesota Vikings",teams:["Minnesota Vikings"]},
  {id:"timberwolves",n:"Minnesota Timberwolves",teams:["Minnesota Timberwolves"]},
  {id:"twins",n:"Minnesota Twins",teams:["Minnesota Twins"]},
  {id:"wild",n:"Minnesota Wild",teams:["Minnesota Wild"]},
  {id:"united",n:"Minnesota United",teams:["Minnesota United"]},
  {id:"lynx",n:"Minnesota Lynx",teams:["Minnesota Lynx"]},
  {id:"gophers",n:"Gophers",teams:TEAMS.filter(t=>t.g==="gopher").map(t=>t.n)}
];
const secOf=n=>SECTIONS.find(x=>x.teams.includes(n));
let ORDER=[];try{ORDER=JSON.parse(localStorage.getItem("mn-order")||"[]")}catch(e){}
let NEWS=[],reorder=false;const MORE=new Set();
function orderedSections(){
  const ids=ORDER.filter(id=>SECTIONS.some(x=>x.id===id));
  SECTIONS.forEach(x=>{if(!ids.includes(x.id))ids.push(x.id)});
  return ids.map(id=>SECTIONS.find(x=>x.id===id));
}
async function loadNews(){
  const all=[],seen=new Set();let got=0,fail=0,extra=null;
  const add=(sid,src,h,href,ts)=>{const k=href.split("?")[0].replace(/\/$/,"");if(seen.has(k))return;seen.add(k);all.push({sid,src,h,href,ts})};
  await Promise.all([
    ...TEAMS.map(async t=>{
      try{
        const j=await getJSON(`https://site.api.espn.com/apis/site/v2/sports/${t.s}/${t.l}/news?team=${t.id}&limit=10`);
        (j.articles||[]).forEach(a=>{
          const href=a.links&&a.links.web&&a.links.web.href,ts=Date.parse(a.published);
          if(!href||!a.headline||isNaN(ts))return;
          const tc=(a.categories||[]).filter(c=>c.type==="team");
          if(tc.length&&!tc.some(c=>String(c.teamId!=null?c.teamId:c.team&&c.team.id)===String(t.id)))return;
          got++;add(secOf(t.n).id,"ESPN",a.headline,href,ts);
        });
      }catch(e){fail++}
    }),
    getJSON("news-extra.json?_="+Math.floor(Date.now()/6e5)).then(j=>{
      extra=j;(j.items||[]).forEach(x=>{const ts=Date.parse(x.ts);if(x.title&&x.url&&x.src!=="Star Tribune"&&!isNaN(ts)&&SECTIONS.some(z=>z.id===x.team))add(x.team,x.src||"News",x.title,x.url,ts)});
    }).catch(()=>{})
  ]);
  NEWS=all.sort((a,b)=>b.ts-a.ts);
  const st=extra&&extra.status?Object.entries(extra.status):[],bad=st.filter(([k,v])=>!/^ok/.test(v)).map(([k])=>k.replace("|","/"));
  newsDiag=`News: ${got} ESPN articles (${TEAMS.length-fail}/${TEAMS.length} teams)`+(extra?`; other feeds ${st.length-bad.length}/${st.length} ok${bad.length?" (failing: "+bad.slice(0,4).join(", ")+(bad.length>4?"\u2026":"")+")":""}`:"; other sources not set up yet");
  showDiag();renderNews();
}
function renderNews(){
  const el=document.getElementById("newslist");if(!el)return;
  const show=x=>filter==="all"||filter===x.id||(filter==="pro"&&x.id!=="gophers")||(filter==="gopher"&&x.id==="gophers")||x.teams.includes(filter);
  const all=orderedSections(),ro=reorder&&filter==="all";
  el.innerHTML=all.filter(show).map(x=>{
    const t=TEAMS.find(y=>y.n===x.teams[0]),items=NEWS.filter(n=>n.sid===x.id),lim=MORE.has(x.id)?8:3,i=all.indexOf(x);
    const rows=items.slice(0,lim).map((n,i)=>`<a class="nrow${i?" sm":""}" href="${esc(n.href)}" target="_blank" rel="noopener"><span class="nt">${esc(n.h)}</span><span class="nm"><b>${esc(n.src)}</b> \u00b7 ${relTime(n.ts)}</span></a>`).join("");
    return `<section class="nsec" style="--c:${t.c};--c2:${t.c2}"><div class="nshead"><img class="nlogo" src="${logoFor(t)}" alt="" onerror="this.style.visibility='hidden'"><h3>${esc(x.n)}</h3>${ro?`<span class="mv"><button data-mv="${x.id}" data-d="-1" aria-label="Move up"${i===0?" disabled":""}>\u25B2</button><button data-mv="${x.id}" data-d="1" aria-label="Move down"${i===all.length-1?" disabled":""}>\u25BC</button></span>`:""}</div>${rows||`<div class="stmsg">${NEWS.length?"No headlines for this team right now.":"Loading headlines\u2026"}</div>`}${items.length>3?`<button class="nmore" data-more="${x.id}">${MORE.has(x.id)?"Show fewer":"Show more"}</button>`:""}</section>`;
  }).join("")||`<div class="msg">No teams for this filter.</div>`;
  const b=document.getElementById("reorderBtn");if(b)b.textContent=ro?"Done":"Reorder teams";
}
function tparts(d){const p=timeFmt.formatToParts(d);
  return [p.filter(x=>x.type!=="dayPeriod"&&x.type!=="literal"||x.type==="literal"&&x.value===":").map(x=>x.value).join(""),(p.find(x=>x.type==="dayPeriod")||{}).value||""]}
// Keeps the record glued to the last word of a name, so a long name can wrap but the record never lands on its own line
function nameRec(n,r){
  const i=n.lastIndexOf(" "),head=i>0?esc(n.slice(0,i))+" ":"",last=esc(i>0?n.slice(i+1):n);
  return head+`<span class="nw">${last}${r?`<span class="rc">${esc(r)}</span>`:""}</span>`;
}
function card(g,mode){
  const live=g.state==="in",done=mode==="final";
  const [tm,ap]=tparts(g.date);
  const when=g.tbd&&!live&&!done?`<div class="when">TBD</div>`:live?`<div class="when live">LIVE</div>`:done?`<div class="when">FINAL</div>`:`<div class="when">${tm}<i>${ap}</i></div>`;
  const r=done?(g.win===true?"w":g.win===false?"l":""):"";
  const score=(live||done)?(g.my==null&&g.their==null?"":`<div class="res ${r}">${r?`<small>${r==="w"?"WIN":"LOSS"}</small>`:""}${esc(g.my??"")}–${esc(g.their??"")}</div>`):(g.tv?`<div><span class="pill tv">${esc(g.tv)}</span></div>`:"");
  const lk=done?[g.box,"Box score"]:live?[g.prev,"Live"]:[g.prev,"Preview"];
  const link=lk&&lk[0]?`<a class="lkbox" href="${esc(lk[0])}" target="_blank" rel="noopener">${lk[1]} \u2197</a>`:"";
  const extra=(live||done)&&g.detail&&g.detail!=="Final"?`<span class="pill">${esc(g.detail)}</span>`:"";
  const pk=pickUI(g);
  return `<div class="game" style="--c:${g.t.c};--c2:${g.t.c2}"><div class="lcol">${when}${score}${link}</div>
    <div><div class="vs"><span>${nameRec(g.t.n,recFor(g,"m"))}</span></div>
    <div class="opp"><em>${g.home?"vs":"at"}</em>${nameRec(g.opp,recFor(g,"o"))}</div>
    <div class="sub">${extra}${pk.pill}</div>${pk.row}</div></div>`;
}
function render(){
  const ok=g=>filter==="all"||filter===g.t.g||filter===g.t.n;
  const cap=new Date();cap.setHours(0,0,0,0);cap.setDate(cap.getDate()+15);
  const all=games.filter(g=>ok(g)&&g.date<cap),rec=recent.filter(ok);
  const cut=new Date();cut.setHours(0,0,0,0);cut.setDate(cut.getDate()+days+1);
  const list=all.filter(g=>g.date<cut),left=all.length-list.length;
  const cntTo=d=>{const c=new Date();c.setHours(0,0,0,0);c.setDate(c.getDate()+d+1);return all.filter(g=>g.date<c).length};
  const nextDays=[7,14].find(d=>d>days&&cntTo(d)>list.length)||14,added=cntTo(nextDays)-list.length;
  let html="",last="";
  if(rec.length){
    html+=`<h2>Last night's scores</h2>`+rec.map(g=>card(g,"final")).join("");
    if(list.length)html+=`<h2 style="margin-top:34px">Today and upcoming</h2>`;
  }
  list.forEach(g=>{
    const d=dayFmt.format(g.date);
    if(d!==last){html+=`<h2>${d}</h2>`;last=d}
    html+=card(g,g.state==="post"?"final":"up");
  });
  if(!list.length&&!rec.length)html=`<div class="msg">${left?`No games in the next ${days} days.`:"No upcoming games found for this filter."}</div>`;
  if(left>0)html+=`<button class="more" id="more">Show ${nextDays===7?"next week":"through 2 weeks"} \u00b7 ${added} more game${added>1?"s":""}</button>`;
  if(failed.length)html+=`<div class="msg">Couldn't load: ${esc(failed.join(", "))}. The team ID in the TEAMS list may need fixing, or that team may be out of season.</div>`;
  out.innerHTML=html;
  const m=document.getElementById("more");if(m)m.onclick=()=>{days=nextDays;render()};
  loadRecords(rec.concat(list));
  updateBadge();
  renderNews();
}
const themeBtn=document.getElementById("theme");

  themeBtn.textContent=t==="light"?"\u263E":"\u2600\uFE0E";

}
