name: Update headlines
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/fetch-news.mjs
      # If index.html is in a subfolder, set OUT above (e.g. OUT=mn/news-extra.json) and change the path below
      - name: Commit changes
        run: |
          git config user.name "headline-bot"
          git config user.email "headline-bot@users.noreply.github.com"
          git add news-extra.json
          git diff --staged --quiet || (git commit -m "Update headlines" && git push)
